<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="DELLI" />
  <title>DELLI</title>
  <meta name="description" content="DELLI AI, DELLI Growth, DELLI Market, and a way to get in touch." />
  <meta property="og:title" content="DELLI" />
  <meta property="og:description" content="DELLI AI, DELLI Growth, DELLI Market, and a way to get in touch." />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f2f7;
      --label: #000000;
      --primary: #007aff;
      --primary-text: #ffffff;
      --secondary-fill: rgba(120, 120, 128, 0.16);
      --secondary-label: rgba(60, 60, 67, 0.6);
      --workshop: #dcd400;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --label: #ffffff;
        --primary: #0a84ff;
        --secondary-fill: rgba(120, 120, 128, 0.32);
        --secondary-label: rgba(235, 235, 245, 0.6);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
        "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100dvh;
      padding:
        calc(var(--safe-top) + 36px)
        0
        calc(var(--safe-bottom) + 32px);
    }

    .page {
      width: min(100%, 430px);
      margin: 0 auto;
      padding: 0 20px;
    }

    .brand {
      display: flex;
      justify-content: center;
      padding: 8px 0 40px;
    }

    .logo {
      display: block;
      width: 148px;
      height: auto;
    }

    @media (prefers-color-scheme: dark) {
      .logo { filter: invert(1); }
    }

    section + section {
      margin-top: 36px;
    }

    h2 {
      margin: 0 4px 4px;
      font-size: 22px;
      font-weight: 700;
      line-height: 28px;
      letter-spacing: 0.35px;
      color: var(--label);
    }

    .lede {
      margin: 0 4px 12px;
      font-size: 15px;
      font-weight: 400;
      line-height: 20px;
      color: var(--secondary-label);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 16px;
      border-radius: 16px;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      line-height: 22px;
      letter-spacing: -0.41px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    a:active {
      filter: brightness(0.92);
    }

    .primary {
      background: var(--primary);
      color: var(--primary-text);
    }

    .secondary {
      background: var(--secondary-fill);
      color: var(--label);
    }

    .workshop {
      background: var(--workshop);
      color: #000000;
      margin-bottom: 36px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      <img class="logo" src="logo.svg" alt="DELLI" />
    </header>

    <a class="workshop" href="https://luma.com/pl50fa7b" target="_blank" rel="noopener noreferrer">Join our free AI workshop</a>

    <section>
      <h2>DELLI AI</h2>
      <p class="lede">The teammate who runs your wholesale.</p>
      <div class="actions">
        <a class="primary" href="https://delli-interactive-demo.plyo.dev/#/orders" target="_blank" rel="noopener noreferrer">Try the interactive demo</a>
        <a class="secondary" href="https://delli.ai/" target="_blank" rel="noopener noreferrer">Find out more</a>
      </div>
    </section>

    <section>
      <h2>DELLI Growth</h2>
      <p class="lede">Know who to sell to next.</p>
      <div class="actions">
        <a class="primary" href="https://growth.delli.com/signin" target="_blank" rel="noopener noreferrer">Try it for free</a>
        <a class="secondary" href="https://delli-growth-deck.vercel.app/" target="_blank" rel="noopener noreferrer">Find out more</a>
      </div>
    </section>

    <section>
      <h2>DELLI Market</h2>
      <p class="lede">Get discovered by independent food buyers.</p>
      <div class="actions">
        <a class="primary" href="https://www.delli.market/pages/sell-with-delli" target="_blank" rel="noopener noreferrer">List for free</a>
      </div>
    </section>

    <section>
      <h2>Chat with me</h2>
      <div class="actions">
        <a class="primary" href="https://calendly.com/alice-delli/delli-demo-call-event" target="_blank" rel="noopener noreferrer">Book a time</a>
        <a class="secondary" href="mailto:alice@delli.com">Email me</a>
      </div>
    </section>
  </main>
</body>
</html>
